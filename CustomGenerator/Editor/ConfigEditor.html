<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CustomGenerator Config</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f4f2ef; --panel: #ffffff; --panel-2: #faf9f7; --line: #e4e0da; --text: #22201d; --muted: #75706a;
  --accent: #c8553d; --accent-soft: #f6e3de; --accent-text: #fff; --ok: #2f8a4c; --ok-soft: #e1f2e6;
  --warn: #b7791f; --warn-soft: #fbf0dc; --bad: #c0392b; --bad-soft: #f8e1de; --focus: #c8553d55;
  --shadow: 0 1px 2px #0000000d, 0 2px 8px #0000000a; --radius: 10px;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --log-bg: #1b1a18; --log-text: #d8d3cc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161514; --panel: #1f1d1b; --panel-2: #252321; --line: #34312d; --text: #ece8e3; --muted: #a09a93;
    --accent: #e0694f; --accent-soft: #3a241f; --accent-text: #fff; --ok: #5cc27d; --ok-soft: #1f3326;
    --warn: #e0a84a; --warn-soft: #3a2f1c; --bad: #ef6b5c; --bad-soft: #3d2220; --focus: #e0694f66;
    --shadow: 0 1px 2px #0000004d; --log-bg: #121110;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: 12.5px; }
a { color: var(--accent); }

/* Top bar */
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 20px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-text);
  display: grid; place-items: center; font-weight: 700; flex: none; }
.brand b { display: block; font-size: 15px; }
.brand small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.status { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.status.dirty { color: var(--warn); }
.status.saved { color: var(--ok); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12.5px;
  background: var(--bad-soft); color: var(--bad); white-space: nowrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { padding: 3px 10px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--panel-2); color: var(--text); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }

/* Layout */
.layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100% - 55px); }
nav { border-right: 1px solid var(--line); padding: 16px 10px; position: sticky; top: 55px; align-self: start; height: calc(100vh - 55px); overflow: auto; }
nav button { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; border: 0; background: none;
  padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--text); }
nav button:hover { background: var(--panel); }
nav button.active { background: var(--panel); box-shadow: var(--shadow); font-weight: 600; }
nav .state { margin-left: auto; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--panel-2); color: var(--muted); font-weight: 500; }
nav .state.on { background: var(--ok-soft); color: var(--ok); }
nav .state.busy { background: var(--accent-soft); color: var(--accent); }
nav .sep { height: 1px; background: var(--line); margin: 10px 12px; }
nav .foot { margin: 18px 12px 0; font-size: 12px; color: var(--muted); }
main { padding: 24px 32px 80px; max-width: 1000px; width: 100%; }
main h1 { font-size: 22px; margin: 0 0 4px; }
main .lead { color: var(--muted); margin: 0 0 20px; }
.banner { padding: 10px 14px; border-radius: var(--radius); margin-bottom: 18px; background: var(--warn-soft); color: var(--text); font-size: 13px; }
.banner b { color: var(--warn); }
.banner.info { background: var(--panel); border: 1px solid var(--line); }

/* Cards and rows */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; }
.card > .head { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card > .head h3 { margin: 0; font-size: 14.5px; }
.card > .head p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.card > .body { padding: 14px 18px; }
.fields > .row, .fields > .card, .fields > .list { transition: opacity .15s; }
.fields.off > :not(.master):not(.rows) { opacity: .45; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(200px, 320px); gap: 16px; padding: 12px 18px; border-top: 1px solid var(--line); align-items: center; }
.fields > .row:first-child { border-top: 0; }
.row.wide { grid-template-columns: 1fr; }
.row.wide .control, .row.wide .chips, .row.wide .tags { justify-content: flex-start; }
.label .name { font-weight: 500; word-break: break-word; }
.label .desc { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.label .err { margin: 3px 0 0; color: var(--bad); font-size: 12.5px; display: none; }
.row.invalid .label .err { display: block; }
.row.invalid input { border-color: var(--bad); }
.changed-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 7px; vertical-align: middle; visibility: hidden; }
.row.changed .changed-dot { visibility: visible; }
.control { display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: 0; flex-wrap: wrap; }
.control > input[type=text], .control > input[type=number], .control > select { width: 100%; flex: 1; }
input[type=text], input[type=number], input[type=search], select, textarea { background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; min-width: 0; }
input:disabled { opacity: .7; }
.reset { visibility: hidden; flex: none; }
.row.changed .reset { visibility: visible; }
.hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
.hint.warn { color: var(--warn); }
.card .card { margin: 12px 18px; box-shadow: none; }

/* Switch */
.switch { position: relative; width: 40px; height: 22px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px #0003; transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 3px solid var(--focus); }

/* Chips, tags, dictionaries */
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 99px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; }
.chip[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip.mono { font-family: var(--mono); font-size: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; width: 100%; }
.tag { display: inline-flex; align-items: center; gap: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 4px 1px 8px; font-family: var(--mono); font-size: 12.5px; }
.tag button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; }
.tags input { flex: 1; min-width: 110px; }
.suggest { width: 100%; }
.suggest .chips { justify-content: flex-start; margin-top: 8px; }
.suggest-title { font-size: 12px; color: var(--muted); margin-top: 8px; }
.dict { width: 100%; display: grid; gap: 6px; }
.dict .pair { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; }
.dict .known { font-family: var(--mono); font-size: 12.5px; padding: 6px 2px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel-2); }
.stepper button { border: 0; background: none; width: 28px; height: 30px; cursor: pointer; }
.stepper button:hover { background: var(--line); }
.stepper input { width: 64px; border: 0; border-radius: 0; text-align: center; background: transparent; }

/* Lists of objects */
.list-tools { display: flex; gap: 8px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.list-tools input { flex: 1; }
.items { padding: 0 12px 12px; display: grid; gap: 8px; }
.items:empty::after { content: attr(data-empty); color: var(--muted); padding: 6px; font-size: 13px; }
details.item { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
details.item[open] { background: var(--panel); }
details.item > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; }
details.item > summary::-webkit-details-marker { display: none; }
details.item > summary::before { content: "›"; color: var(--muted); font-size: 18px; line-height: 1; transition: transform .15s; width: 10px; }
details.item[open] > summary::before { transform: rotate(90deg); }
.item-title { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-sub { color: var(--muted); font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--line); color: var(--muted); white-space: nowrap; }
.badge.on { background: var(--ok-soft); color: var(--ok); }
.badge.alert { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.item-body { border-top: 1px solid var(--line); }
.item-actions { display: flex; gap: 6px; justify-content: flex-end; padding: 10px 18px; border-top: 1px solid var(--line); }
.sum { margin-left: auto; font-size: 12.5px; padding: 2px 10px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); white-space: nowrap; }
.sum.off { background: var(--warn-soft); color: var(--warn); }

/* Percentage bar */
.bar-wrap { padding: 14px 18px 4px; }
.bar { position: relative; display: flex; height: 34px; border-radius: 8px; overflow: hidden; user-select: none; touch-action: none; border: 1px solid var(--line); }
.bar .seg { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #1d1b19; overflow: hidden; white-space: nowrap; min-width: 0; }
.bar .handle { position: absolute; top: 0; bottom: 0; width: 14px; margin-left: -7px; cursor: ew-resize; z-index: 1; }
.bar .handle::after { content: ""; position: absolute; left: 6px; top: 5px; bottom: 5px; width: 2px; border-radius: 2px; background: #fffc; box-shadow: 0 0 0 1px #0003; }
.bar-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.bar-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* Tables */
table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
table.grid th, table.grid td { text-align: left; padding: 7px 18px; border-top: 1px solid var(--line); vertical-align: top; }
table.grid th { color: var(--muted); font-weight: 500; font-size: 12px; border-top: 0; }
table.grid td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.grid tr.zero td { color: var(--muted); }
.names { display: flex; flex-wrap: wrap; gap: 4px; }
.names span { font-family: var(--mono); font-size: 11.5px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }

/* Last run */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
.stat small { display: block; color: var(--muted); font-size: 12px; }
.stat b { font-size: 17px; font-variant-numeric: tabular-nums; }
.stat.alert b { color: var(--bad); }
.map-image { display: block; width: 100%; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel-2); }
.map-missing { padding: 40px; text-align: center; color: var(--muted); }
pre.report { margin: 0; padding: 14px 18px; overflow: auto; font: 12px/1.5 var(--mono); }

/* Generate */
.runs { display: grid; gap: 8px; }
.run-row { display: grid; grid-template-columns: 150px 1fr auto auto; gap: 8px; align-items: center; }
.gen-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.progress { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
pre.log { margin: 0; height: 340px; overflow: auto; padding: 12px 16px; background: var(--log-bg); color: var(--log-text); font: 12px/1.5 var(--mono); border-radius: 0 0 var(--radius) var(--radius); white-space: pre-wrap; word-break: break-all; }
pre.log .cg { color: #f0a58f; }
pre.log .step { color: #9fc7a2; }
pre.log .err { color: #ff8a80; }
.cmd { font: 12px/1.5 var(--mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; word-break: break-all; }

/* Modal */
.overlay { position: fixed; inset: 0; background: #0008; display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal { background: var(--panel); border-radius: 14px; width: min(720px, 100%); max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px #0005; }
.modal > .head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal > .head h2 { margin: 0; font-size: 17px; }
.modal > .content { overflow: auto; padding: 8px 0; }
.modal > .foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
.preset { display: flex; gap: 14px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--line); }
.preset:first-child { border-top: 0; }
.preset div { flex: 1; }
.preset p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.diff { width: 100%; border-collapse: collapse; font-size: 13px; }
.diff td { padding: 7px 20px; border-top: 1px solid var(--line); vertical-align: top; }
.diff td.path { color: var(--muted); }
.diff .from { text-decoration: line-through; color: var(--muted); font-family: var(--mono); font-size: 12px; }
.diff .to { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 600; }

/* Start screen */
.start { max-width: 560px; margin: 10vh auto; text-align: center; padding: 0 16px; }
.drop { margin-top: 20px; border: 2px dashed var(--line); border-radius: 14px; padding: 36px 20px; background: var(--panel); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.msg { color: var(--bad); margin-top: 12px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
.toast.show { opacity: 1; }

@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; height: auto; display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
  nav button { width: auto; white-space: nowrap; }
  nav .foot, nav .sep { display: none; }
  main { padding: 16px; }
  .row { grid-template-columns: 1fr; }
  .control, .chips, .tags { justify-content: flex-start; }
  .top { flex-wrap: wrap; }
  .run-row { grid-template-columns: 1fr 1fr; }
}
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast" role="status"></div>

/* ---------- helpers ---------- */
function t(key, ...args) {
  const value = (UI[S.lang] || UI.en)[key] ?? UI.en[key];
  if (typeof value === "function") return value(...args);
  return args.reduce((s, a, i) => s.replace(`{${i}}`, a), value);
}
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k in el && typeof v !== "string") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
// replaceChildren that skips null/false like h() does (the DOM would print them as text)
const fill = (el, ...children) => el.replaceChildren(...children.flat().filter(c => c != null && c !== false));
const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const isGroup = n => n && n.type === "object" && n.properties;
const isDict = n => n && n.type === "object" && n.additionalProperties && !n.properties;
const isObjectList = n => n && n.type === "array" && isGroup(n.items);
const store = { get(k, d) { try { const v = localStorage.getItem("cg." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("cg." + k, JSON.stringify(v)); } catch { } } };
function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text; el.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.remove("show"), 2800);
}
function duration(seconds) {
  const m = Math.floor(seconds / 60), s = seconds % 60;
  return m ? `${m}m ${String(s).padStart(2, "0")}s` : `${s}s`;
}
function randomSeed() { return Math.floor(Math.random() * 2147483647); }
function defaultsFor(node) {
  if (node.default !== undefined) return clone(node.default);
  if (isGroup(node)) { const o = {}; for (const [k, n] of Object.entries(node.properties)) if (!n.readOnly) o[k] = defaultsFor(n); return o; }
  if (node.type === "array") return [];
  if (node.type === "object") return {};
  if (node.type === "boolean") return false;
  if (node.type === "number" || node.type === "integer") return node.minimum > 0 ? node.minimum : 0;
  return node.enum ? node.enum[0] : "";
}
function masterKey(node, obj) { return MASTER_KEYS.find(k => node.properties[k] && node.properties[k].type === "boolean" && k in (obj || {})) || MASTER_KEYS.find(k => node.properties[k] && node.properties[k].type === "boolean"); }
function itemTitle(listNode, item, index) {
  for (const key of listNode["x-itemTitle"] || []) if (item[key]) return String(item[key]);
  return `#${index + 1}`;
}
// Localized key of a field by its code name
function keyOf(node, name) { return node && node.properties && Object.keys(node.properties).find(k => node.properties[k]["x-name"] === name); }
// Walks "Section.Field" code names; returns { node, obj, key } of the last one
function locate(path, root = S.config) {
  let node = S.schema, obj = root, key = null;
  const names = path.split(".");
  for (let i = 0; i < names.length; i++) {
    key = keyOf(node, names[i]);
    if (!key) return null;
    if (i < names.length - 1) {
      if (typeof obj[key] !== "object" || obj[key] === null) obj[key] = defaultsFor(node.properties[key]);
      obj = obj[key]; node = node.properties[key];
    }
  }
  return { node: node.properties[key], obj, key };
}
function valueAt(path, root = S.config) { const at = locate(path, root); return at ? at.obj[at.key] : undefined; }

/* ---------- validation ---------- */
function problem(node, value) {
  if (node.type === "number" || node.type === "integer") {
    if (typeof value !== "number" || Number.isNaN(value)) return t("notNumber");
    if (node.type === "integer" && !Number.isInteger(value)) return t("notInt");
    if (node.minimum !== undefined && value < node.minimum) return t("min", node.minimum);
    if (node.maximum !== undefined && value > node.maximum) return t("max", node.maximum);
  }
  return null;
}
function countProblems(node, value) {
  if (!node) return 0;
  if (isGroup(node)) return Object.entries(node.properties).reduce((n, [k, c]) => n + (value && k in value ? countProblems(c, value[k]) : 0), 0);
  if (isDict(node)) return Object.values(value || {}).reduce((n, v) => n + countProblems(node.additionalProperties, v), 0);
  if (node.type === "array" && Array.isArray(value)) return isObjectList(node) ? value.reduce((n, v) => n + countProblems(node.items, v), 0) : 0;
  return problem(node, value) ? 1 : 0;
}

/* ---------- diff (presets) ---------- */
function diff(node, a, b, path, out) {
  if (isGroup(node)) {
    for (const [k, child] of Object.entries(node.properties)) {
      if (k.startsWith("$") || child.readOnly) continue;
      diff(child, a?.[k], b?.[k], [...path, k], out);
    }
  } else if (isObjectList(node) && Array.isArray(a) && Array.isArray(b) && a.length === b.length) {
    b.forEach((item, i) => diff(node.items, a[i], item, [...path, itemTitle(node, item, i)], out));
  } else if (!same(a, b)) {
    out.push({ path: path.join(" › "), from: a, to: b });
  }
  return out;
}
const show = v => v === undefined ? "—" : JSON.stringify(v);

/* ---------- state ---------- */
function changed() {
  S.dirty = true;
  updateTop();
  updateNav();
}
function updateTop() {
  const status = document.getElementById("status");
  if (!status || !S.config) return;
  status.textContent = S.dirty ? t("unsaved") : (status.dataset.saved ? t("saved") : t("noChanges"));
  status.className = "status" + (S.dirty ? " dirty" : status.dataset.saved ? " saved" : "");
  const errors = countProblems(S.schema, S.config);
  const pill = document.getElementById("errors");
  pill.hidden = errors === 0; pill.textContent = t("errors", errors);
}
const generating = () => !!S.extra.generation?.running;

/* ---------- controls ---------- */
function fieldRow(key, node, obj, onChange, ctx) {
  const hasDefault = node.default !== undefined;
  const get = () => obj[key] !== undefined ? obj[key] : node.default;
  const row = h("div", { class: "row", "data-key": key });
  const err = h("p", { class: "err" });
  const label = h("div", { class: "label" },
    h("span", { class: "name" }, key), h("span", { class: "changed-dot", title: hasDefault ? t("defaultIs", JSON.stringify(node.default)) : null }),
    node.description ? h("p", { class: "desc" }, node.description) : null, err);
  const control = h("div", { class: "control" });
  row.append(label, control);

  const refresh = () => {
    const value = get();
    row.classList.toggle("changed", hasDefault && !same(value, node.default));
    const p = problem(node, value);
    row.classList.toggle("invalid", !!p); err.textContent = p || "";
  };
  const set = value => { obj[key] = value; refresh(); changed(); onChange && onChange(value); };
  const suggest = node["x-suggest"];
  const knownPrefabs = suggest === "prefabs" ? (S.extra.prefabs?.[ctx?.folder] || []) : null;

  let input;
  if (node.type === "boolean") {
    input = h("input", { type: "checkbox", checked: !!get(), disabled: node.readOnly, onchange: e => set(e.target.checked), "aria-label": key });
    control.append(h("label", { class: "switch" }, input, h("span")));
  } else if (node.type === "number" || node.type === "integer") {
    input = h("input", { type: "number", value: get() ?? "", step: node.type === "integer" ? "1" : "any", min: node.minimum, max: node.maximum, disabled: node.readOnly, "aria-label": key,
      oninput: e => set(e.target.value === "" ? NaN : Number(e.target.value)) });
    control.append(input);
  } else if (node.type === "string" && node.enum) {
    input = h("select", { disabled: node.readOnly, onchange: e => set(e.target.value), "aria-label": key },
      node.enum.map(v => h("option", { value: v, selected: v === get() }, v)));
    if (!node.enum.includes(get()) && get() != null) input.prepend(h("option", { value: get(), selected: true }, get()));
    control.append(input);
  } else if (node.type === "array" && node.items && node.items.enum) {
    row.classList.add("wide");
    const chips = h("div", { class: "chips" });
    for (const v of node.items.enum) {
      const chip = h("button", { type: "button", class: "chip", "aria-pressed": String((get() || []).includes(v)),
        onclick: () => {
          const list = [...(get() || [])];
          const i = list.indexOf(v);
          if (i >= 0) list.splice(i, 1); else list.push(v);
          chip.setAttribute("aria-pressed", String(i < 0));
          set(list);
        } }, v);
      chips.append(chip);
    }
    for (const v of (get() || []).filter(v => !node.items.enum.includes(v))) chips.append(h("span", { class: "chip", title: "unknown value", style: "border-color: var(--bad); color: var(--bad)" }, v));
    control.append(chips);
  } else if (node.type === "array") {
    row.classList.add("wide");
    control.append(tagInput(get() || [], list => set(list), knownPrefabs));
  } else if (isDict(node)) {
    row.classList.add("wide");
    control.append(dictInput(get() || {}, node.additionalProperties, dict => set(dict), knownPrefabs));
  } else {
    input = h("input", { type: "text", value: get() ?? "", disabled: node.readOnly, spellcheck: false, "aria-label": key, oninput: e => set(e.target.value) });
    control.append(input);
    if (key.includes("{0}")) {
      const preview = h("div", { class: "hint" });
      const update = () => { const v = String(get() || ""); preview.textContent = t("preview", v.replace("{0}", "4000").replace("{1}", "12345") + (v.endsWith(".map") ? "" : ".map")); };
      input.addEventListener("input", update); update();
      label.append(preview);
    }
    if (suggest === "customFiles") {
      const files = S.extra.files?.custom || [];
      const id = "files-" + Math.random().toString(36).slice(2);
      input.setAttribute("list", id);
      control.append(h("datalist", { id }, files.map(f => h("option", { value: f }))));
      const warn = h("div", { class: "hint warn" });
      const check = () => { const v = String(get() || ""); warn.textContent = v && files.length && !files.includes(v) ? t("fileMissing", v) : ""; };
      input.addEventListener("input", check); check();
      label.append(warn);

// known: exact names to offer as chips (prefab names of the group), null when the field has no suggestions
function tagInput(initial, onChange, known) {
  let list = [...initial];
  const wrap = h("div", { class: "suggest" });
  const tags = h("div", { class: "tags" });
  const chips = h("div", { class: "chips" });
  const input = h("input", { type: "text", placeholder: t("tagPlaceholder"), spellcheck: false,
    onkeydown: e => {
      if (e.key === "Enter" && input.value.trim()) { e.preventDefault(); list.push(input.value.trim()); input.value = ""; draw(); onChange([...list]); }
      else if (e.key === "Backspace" && !input.value && list.length) { list.pop(); draw(); onChange([...list]); }
    } });
  const draw = () => {
    tags.replaceChildren(...list.map((v, i) => h("span", { class: "tag" }, v,
      h("button", { type: "button", "aria-label": `${t("remove")} ${v}`, onclick: () => { list.splice(i, 1); draw(); onChange([...list]); } }, "×"))), input);
    chips.replaceChildren(...(known || []).map(name => h("button", { type: "button", class: "chip mono", "aria-pressed": String(list.includes(name)),
      onclick: () => { const i = list.indexOf(name); if (i >= 0) list.splice(i, 1); else list.push(name); draw(); onChange([...list]); } }, name)));
  };
  wrap.append(tags);
  if (known) wrap.append(h("div", { class: "suggest-title" }, known.length ? t("knownPrefabs") : t("noPrefabs")), chips);
  draw();
  return wrap;
}

// Rows "name: value". Known names are always listed with a stepper, empty value = no rule
function dictInput(initial, valueNode, onChange, known) {
  const knownSet = new Set(known || []);
  let pairs = Object.entries(initial).map(([k, v]) => ({ key: k, value: v, known: knownSet.has(k) }));
  for (const name of known || []) if (!(name in initial)) pairs.push({ key: name, value: null, known: true });
  pairs.sort((a, b) => (b.known - a.known) || 0);
  const wrap = h("div", { class: "dict" });
  const emit = () => onChange(Object.fromEntries(pairs.filter(p => p.key.trim() !== "" && p.value != null && !Number.isNaN(p.value)).map(p => [p.key, p.value])));
  const draw = () => {
    fill(wrap, ...pairs.map((pair, i) => {
      const value = h("input", { type: "number", value: pair.value ?? "", placeholder: t("copiesDefault"), step: valueNode.type === "integer" ? "1" : "any", min: valueNode.minimum,
        "aria-label": pair.key, oninput: e => { pair.value = e.target.value === "" ? null : Number(e.target.value); emit(); } });
      const step = d => { pair.value = Math.max(valueNode.minimum ?? 0, (pair.value ?? (d > 0 ? 0 : 1)) + d); value.value = pair.value; emit(); };
      return h("div", { class: "pair" },
        pair.known ? h("span", { class: "known" }, pair.key)
          : h("input", { type: "text", value: pair.key, placeholder: t("keyPlaceholder"), spellcheck: false, oninput: e => { pair.key = e.target.value; emit(); } }),
        h("span", { class: "stepper" }, h("button", { type: "button", "aria-label": "−", onclick: () => step(-1) }, "−"), value, h("button", { type: "button", "aria-label": "+", onclick: () => step(1) }, "+")),
        h("button", { type: "button", class: "btn ghost small", "aria-label": t("remove"), title: t("remove"),
          onclick: () => { if (pair.known) { pair.value = null; value.value = ""; } else { pairs.splice(i, 1); draw(); } emit(); } }, "×"));
    }),
    h("div", {}, h("button", { type: "button", class: "btn small", onclick: () => { pairs.push({ key: "", value: valueNode.default ?? 1, known: false }); draw(); [...wrap.querySelectorAll(".pair")].pop().querySelector("input").focus(); } }, "+ " + t("addKey"))),
    known && !known.length ? h("div", { class: "hint" }, t("noPrefabs")) : null);
  };
  draw();
  return wrap;
}

/* ---------- groups and lists ---------- */
// rowsCard: plain rows go into their own card, groups and lists follow as separate cards (section level)
function renderFields(node, obj, onAnyChange, rowsCard, ctx) {
  const fields = h("div", { class: "fields" });
  const rows = rowsCard ? h("div", { class: "fields" }) : fields;
  if (rowsCard) fields.append(h("section", { class: "card rows" }, rows));
  const master = masterKey(node, obj);
  const applyMaster = () => {
    const off = master !== undefined && obj[master] === false;
    fields.classList.toggle("off", off);
    rows.classList.toggle("off", off);
  };
  const notify = () => { applyMaster(); onAnyChange && onAnyChange(); };

  for (const [key, child] of Object.entries(node.properties)) {
    if (key.startsWith("$") || (child.readOnly && !(key in obj))) continue;
    if (isGroup(child)) {
      if (typeof obj[key] !== "object" || obj[key] === null) obj[key] = defaultsFor(child);
      fields.append(groupCard(key, child, obj[key], notify, ctx));
    } else if (isObjectList(child)) {
      if (!Array.isArray(obj[key])) obj[key] = [];
      fields.append(listCard(key, child, obj[key], notify));
    } else {
      const row = fieldRow(key, child, obj, notify, ctx);
      if (key === master) row.classList.add("master");
      rows.append(row);
    }
  }
  if (rowsCard && !rows.childElementCount) fields.firstElementChild.remove();
  applyMaster();
  return fields;
}

function groupCard(title, node, obj, onAnyChange, ctx) {
  const head = h("div", { class: "head" }, h("div", {}, h("h3", {}, title), node.description ? h("p", {}, node.description) : null));
  let sum, bar;
  if (node["x-sum"]) {
    sum = h("span", { class: "sum" });
    head.append(sum);
  }
  const fields = renderFields(node, obj, () => { updateSum(); bar && bar.update(); onAnyChange && onAnyChange(); }, false, ctx);
  const updateSum = () => {
    if (!sum) return;
    const spec = node["x-sum"];
    const keys = sumKeys(node);
    const total = Math.round(keys.reduce((s, k) => s + (Number(obj[k] ?? node.properties[k].default) || 0), 0) * 100) / 100;
    const ok = Math.abs(total - spec.target) < 0.01;
    sum.textContent = ok ? t("sum", total) : t("sumBad", total, spec.target);
    sum.classList.toggle("off", !ok);
  };
  const card = h("section", { class: "card" }, head);
  if (node["x-sum"]) { bar = percentBar(node, obj, fields); card.append(bar.el); }
  card.append(fields);
  updateSum();
  return card;
}

function sumKeys(node) {
  const names = node["x-sum"].fields;
  return names ? names.map(n => keyOf(node, n) || n).filter(k => node.properties[k]) : Object.keys(node.properties);
}

// Draggable stacked bar for fields that add up to a target (tiers, biomes); dragging a divider moves value between neighbours
function percentBar(node, obj, fields) {
  const keys = sumKeys(node);
  const el = h("div", { class: "bar-wrap" });
  const bar = h("div", { class: "bar" });
  const legend = h("div", { class: "bar-legend" });
  el.append(bar, legend);
  const color = (k, i) => COLORS[node.properties[k]["x-name"]] || COLORS[k] || FALLBACK_COLORS[i % FALLBACK_COLORS.length];
  const values = () => keys.map(k => Math.max(0, Number(obj[k] ?? node.properties[k].default) || 0));

  const setField = (k, v) => {
    const input = fields.querySelector(`.row[data-key="${CSS.escape(k)}"] input`);
    if (input) { input.value = v; input.dispatchEvent(new Event("input", { bubbles: true })); } else { obj[k] = v; changed(); }
  };

  const update = () => {
    const v = values(), total = v.reduce((a, b) => a + b, 0) || 1;
    bar.replaceChildren(...keys.map((k, i) => h("div", { class: "seg", style: `width:${v[i] / total * 100}%; background:${color(k, i)}`, title: `${k}: ${v[i]}` }, v[i] / total > 0.07 ? `${k} ${v[i]}` : "")));
    let acc = 0;
    keys.slice(0, -1).forEach((k, i) => {
      acc += v[i];
      const handle = h("div", { class: "handle", style: `left:${acc / total * 100}%`, role: "separator", "aria-label": `${keys[i]} / ${keys[i + 1]}` });
      handle.addEventListener("pointerdown", e => drag(e, i));
      bar.append(handle);
    });
    legend.replaceChildren(...keys.map((k, i) => h("span", {}, h("i", { style: `background:${color(k, i)}` }), `${k} ${v[i]}`)));
  };

  const drag = (e, i) => {
    e.preventDefault();
    const rect = bar.getBoundingClientRect();
    const v = values(), total = v.reduce((a, b) => a + b, 0) || 1;
    const before = v.slice(0, i).reduce((a, b) => a + b, 0), pair = v[i] + v[i + 1];
    const move = ev => {
      const at = Math.round((ev.clientX - rect.left) / rect.width * total);
      const left = Math.min(pair, Math.max(0, at - before));
      if (left === Number(obj[keys[i]])) return;
      setField(keys[i], left);
      setField(keys[i + 1], pair - left);
    };
    const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  };

  update();
  return { el, update };
}

function listCard(title, node, list, onAnyChange) {
  const items = h("div", { class: "items", "data-empty": t("empty") });
  const count = h("span", { class: "badge" });
  const card = h("section", { class: "card list" }, h("div", { class: "head" }, h("div", {}, h("h3", {}, title), node.description ? h("p", {}, node.description) : null), count));
  const addable = !!node["x-addable"];
  let filter = "";

  const draw = () => {
    items.replaceChildren(...list.map((item, i) => listItem(node, list, item, i, draw, onAnyChange)).filter(el => !filter || el.dataset.search.includes(filter)));
    count.textContent = t("items", list.length);
  };
  card.redraw = draw;
  card.addItem = item => {
    list.push(item); filter = ""; draw(); changed(); onAnyChange && onAnyChange();
    const last = items.lastElementChild; if (last) { last.open = true; last.scrollIntoView({ block: "center", behavior: "smooth" }); }
  };

  const tools = h("div", { class: "list-tools" });
  if (list.length > 6 || !addable) tools.append(h("input", { type: "search", placeholder: t("search"), oninput: e => { filter = e.target.value.trim().toLowerCase(); draw(); } }));
  if (addable) tools.append(h("button", { type: "button", class: "btn", onclick: () => card.addItem(defaultsFor(node.items)) }, "+ " + t("add")));
  if (tools.childElementCount) card.append(tools);
  card.append(items);
  draw();
  return card;

function listItem(node, list, item, index, redraw, onAnyChange) {
  const master = masterKey(node.items, item);
  const titleEl = h("span", { class: "item-title" });
  const sub = h("span", { class: "item-sub" });
  const badges = h("span", { style: "display:flex; gap:6px; margin-left:auto; align-items:center" });
  const details = h("details", { class: "item" });
  const ctx = { folder: item.Folder };

  const summarize = () => {
    const title = itemTitle(node, item, index);
    titleEl.textContent = title;
    const secondary = (node["x-itemTitle"] || []).map(k => item[k]).filter(v => v && String(v) !== title)[0];
    sub.textContent = secondary || "";
    badges.replaceChildren();
    if (master) {
      const on = item[master] !== false;
      badges.append(h("span", { class: "badge" + (on ? " on" : "") }, master === "ShouldChange" ? (on ? t("changed") : t("vanilla")) : (on ? t("on") : t("off"))));
    }
    if (item.Generate === false && item[master] !== false) badges.append(h("span", { class: "badge alert" }, t("notGenerated")));
    const errors = countProblems(node.items, item);
    if (errors) badges.append(h("span", { class: "badge alert" }, t("errors", errors)));
    details.dataset.search = [title, secondary].join(" ").toLowerCase();
  };

  const summary = h("summary", {}, titleEl, sub, badges);
  if (master) {
    const toggle = h("input", { type: "checkbox", checked: item[master] !== false, "aria-label": master,
      onclick: e => e.stopPropagation(),
      onchange: e => { item[master] = e.target.checked; summarize(); changed(); if (body) body.replaceWith(body = renderBody()); onAnyChange && onAnyChange(); } });
    summary.append(h("label", { class: "switch", onclick: e => e.stopPropagation() }, toggle, h("span")));
  }
  details.append(summary);

  let body = null;
  const renderBody = () => {
    const wrap = h("div", { class: "item-body" }, renderFields(node.items, item, () => { summarize(); onAnyChange && onAnyChange(); }, false, ctx));
    if (node["x-addable"]) {
      let armed = false;
      const removeBtn = h("button", { type: "button", class: "btn small danger", onclick: () => {
        if (!armed) { armed = true; removeBtn.textContent = t("removeSure"); setTimeout(() => { armed = false; removeBtn.textContent = t("remove"); }, 3000); return; }
        list.splice(list.indexOf(item), 1); changed(); redraw(); onAnyChange && onAnyChange();
      } }, t("remove"));
      wrap.append(h("div", { class: "item-actions" },
        h("button", { type: "button", class: "btn small", onclick: () => { list.splice(list.indexOf(item) + 1, 0, clone(item)); changed(); redraw(); } }, t("duplicate")),
        removeBtn));
    }
    return wrap;
  };
  // Body is built on first open: the monument list has ~20 groups with many fields each
  details.addEventListener("toggle", () => { if (details.open && !body) details.append(body = renderBody()); });
  summarize();
  return details;
}

function drawSection() {
  const main = document.getElementById("main");

  if (S.section === TAB_LAST) return main.replaceChildren(...lastRunView());
  const key = S.section, node = S.schema.properties[key];
  if (typeof S.config[key] !== "object" || S.config[key] === null) S.config[key] = defaultsFor(node);
  const content = [h("h1", {}, key)];
  if (node.description) content.push(h("p", { class: "lead" }, node.description));
  if (S.embedded && !S.handle && !API) content.push(h("div", { class: "banner", html: t("banner", S.savedAt) }));
  const fields = renderFields(node, S.config[key], null, true);
  content.push(fields);
  if (node["x-name"] === "CustomMonuments") {
    const list = [...fields.children].find(el => el.classList.contains("list"));
    if (list) content.push(customFilesCard(S.config[key], list));
  }
  if (node["x-name"] === "Swap") content.push(swapFilesCard());
  main.replaceChildren(...content);
}

}

  const draw = () => {
    wrap.replaceChildren(...gen.runs.map((run, i) => {
      const custom = !SIZES.includes(run.size);
      const size = h("select", { "aria-label": t("size"), onchange: e => { run.size = Number(e.target.value); saveGen(); onChange(); } },
        [...new Set([...SIZES, run.size])].sort((a, b) => a - b).map(s => h("option", { value: s, selected: s === run.size }, s)));
      const seed = h("input", { type: "number", min: 0, value: run.seed, "aria-label": t("seed"), oninput: e => { run.seed = Number(e.target.value); saveGen(); onChange(); } });
      return h("div", { class: "run-row" }, size, seed,
        h("button", { type: "button", class: "btn small", title: t("random"), "aria-label": t("random"), onclick: () => { run.seed = randomSeed(); seed.value = run.seed; saveGen(); onChange(); } }, "🎲"),
        h("button", { type: "button", class: "btn ghost small", "aria-label": t("remove"), disabled: gen.runs.length === 1, onclick: () => { gen.runs.splice(i, 1); saveGen(); draw(); onChange(); } }, "×"));
    }),
    h("div", { style: "display:flex; gap:8px; flex-wrap:wrap" },
      h("button", { type: "button", class: "btn small", onclick: () => { gen.runs.push({ size: gen.runs.at(-1)?.size || 4000, seed: randomSeed() }); saveGen(); draw(); onChange(); } }, "+ " + t("addMap")),
      h("button", { type: "button", class: "btn small", onclick: () => { for (let i = 0; i < 5; i++) gen.runs.push({ size: gen.runs.at(-1)?.size || 4000, seed: randomSeed() }); saveGen(); draw(); onChange(); } }, t("randomMany"))));
  };
  draw();
  return wrap;
}

function commandText() {
  return gen.runs.map(r => `RustDedicated.exe -batchmode -nographics +server.identity cgen +server.level "Procedural Map" +server.worldsize ${r.size} +server.seed ${r.seed}${gen.args ? " " + gen.args : ""}`).join("\n");
}

function generateView() {
  const out = [h("h1", {}, t("genTitle")), h("p", { class: "lead" }, t("genLead"))];
  if (API && !S.config) out.push(h("div", { class: "banner info" }, t("firstRun")));
  if (API && !S.extra.rustFound) out.push(h("div", { class: "banner" }, t("noRust")));

  const cmd = h("div", { class: "cmd" }, commandText());
  const refreshCmd = () => { cmd.textContent = commandText(); };
  const form = h("section", { class: "card" }, h("div", { class: "head" }, h("h3", {}, t("maps"))),
    h("div", { class: "body" }, runsEditor(refreshCmd),
      h("details", { style: "margin-top:12px" }, h("summary", { style: "cursor:pointer; color:var(--muted)" }, t("extraArgs")),
        h("input", { type: "text", value: gen.args, spellcheck: false, placeholder: "+server.tickrate 30", style: "width:100%; margin-top:8px", oninput: e => { gen.args = e.target.value; saveGen(); refreshCmd(); } }))));
  out.push(form);

  if (!API) {
    out.push(h("section", { class: "card" }, h("div", { class: "body" },
      h("p", { html: t("noLauncher"), style: "margin-top:0" }), cmd,
      h("div", { class: "gen-actions" }, h("button", { type: "button", class: "btn", onclick: e => copy(cmd.textContent, e.target) }, t("copy"))))));
    return out;
  }

  const startBtn = h("button", { type: "button", class: "btn primary", onclick: startGeneration }, S.config ? t("start") : t("startNoSave"));
  const stopBtn = h("button", { type: "button", class: "btn danger", onclick: stopGeneration }, t("stop"));
  const status = h("div", { class: "progress", id: "gen-status" });
  form.querySelector(".body").append(h("div", { class: "gen-actions" }, startBtn, stopBtn, status));

  const logBox = h("pre", { class: "log", id: "gen-log" });
  const onlyMod = h("input", { type: "checkbox", checked: gen.onlyMod, onchange: e => { gen.onlyMod = e.target.checked; saveGen(); updateGeneration(); } });
  out.push(h("section", { class: "card" }, h("div", { class: "head" }, h("h3", {}, "Log"), h("span", { class: "spacer", style: "flex:1" }),
    h("label", { style: "display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--muted)" }, h("span", { class: "switch" }, onlyMod, h("span")), t("onlyMod"))), logBox));
  out.push(h("div", { id: "gen-done" }));
  setTimeout(updateGeneration);
  return out;
}

async function copy(text, button) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const area = h("textarea", { style: "position:fixed; opacity:0" }, text);
    document.body.append(area); area.select(); document.execCommand("copy"); area.remove();
  }
  if (button) { const old = button.textContent; button.textContent = t("copied"); setTimeout(() => button.textContent = old, 1500); }
}

function updateGeneration() {
  const g = S.extra.generation || {};
  const status = document.getElementById("gen-status");
  if (status) {
    const running = g.running && g.current;
    const step = running ? currentStep(g.log || []) : null;
    fill(status, ...(running
      ? [h("span", { class: "spinner" }), h("b", {}, t("running", g.current.size, g.current.seed)), h("span", { class: "badge" }, duration(g.current.seconds)),
         step ? h("span", { class: "hint", style: "margin:0" }, t("step", step)) : null, g.queued?.length ? h("span", { class: "badge" }, t("queued", g.queued.length)) : null]
      : [h("span", { class: "hint", style: "margin:0" }, t("idle"))]));
    document.querySelector("#main .btn.primary")?.toggleAttribute("disabled", !!g.running);
    document.querySelector("#main .btn.danger")?.toggleAttribute("disabled", !g.running);
  }
  const logBox = document.getElementById("gen-log");
  if (logBox) {
    const atBottom = logBox.scrollHeight - logBox.scrollTop - logBox.clientHeight < 30;
    const lines = (g.log || []).filter(l => !gen.onlyMod || /\[CGen|^\[\d+(\.\d+)?s\]|error|exception/i.test(l));
    logBox.replaceChildren(...lines.map(l => h("div", { class: /error|exception/i.test(l) ? "err" : /\[CGen/.test(l) ? "cg" : /^\[\d/.test(l) ? "step" : "" }, l)));
    if (atBottom) logBox.scrollTop = logBox.scrollHeight;
  }
  const done = document.getElementById("gen-done");
  if (done) {
    done.replaceChildren(...(g.done?.length ? [h("section", { class: "card" }, h("div", { class: "head" }, h("h3", {}, t("doneRuns"))),
      h("table", { class: "grid" }, h("tbody", {}, g.done.map(d => h("tr", {}, h("td", {}, `${d.size} / ${d.seed}`), h("td", { class: "num" }, duration(d.seconds)),
        h("td", {}, d.stopped ? h("span", { class: "badge warn" }, t("stopped")) : d.exitCode === 0 ? h("span", { class: "badge on" }, t("ok")) : h("span", { class: "badge alert" }, t("exitCode", d.exitCode))))))))] : []));
  }
}

// Last "[12.3s] Step name" line of the procedural generator, or the last mod line
function currentStep(lines) {
  for (let i = lines.length - 1; i >= 0; i--) {
    const m = /^\[\d+(?:\.\d+)?s\]\s+(.+)$/.exec(lines[i]);
    if (m) return m[1];
    const c = /^\[CGen[^\]]*\]\s+(.+)$/.exec(lines[i]);
    if (c) return c[1].slice(0, 80);
  }
  return null;
}

async function startGeneration() {
  if (S.config) {
    if (!canSave()) return;
    if (S.dirty && !(await save())) return;
  }
  try {
    await api("POST", "/api/generate", JSON.stringify({ runs: gen.runs, args: gen.args }));
    toast(t("genStarted"));
    gen.lastDone = 0;
    await poll();
  } catch (e) { toast(e.message); }
}
async function stopGeneration() {
  try { await api("POST", "/api/stop", "{}"); await poll(); } catch (e) { toast(e.message); }
}

// While a map is generating: status every second, and after each finished map the new last run and config
async function poll() {
  clearTimeout(gen.timer);
  try {
    const was = S.extra.generation;
    S.extra.generation = await api("GET", "/api/generation");
    const g = S.extra.generation;
    const finished = (g.done?.length || 0) > (was?.done?.length || 0) || (was?.running && !g.running);
    if (finished) {
      const last = g.done?.at(-1);
      await refreshState(true);
      if (last && !last.stopped) toast(t("mapReady", last.size, last.seed));
      if (S.section === TAB_LAST) drawSection();
    }
    if (was?.running !== g.running) drawNav();
    if (S.section === TAB_GENERATE) updateGeneration();
  } catch { /* launcher closed */ }
  if (S.extra.generation?.running) gen.timer = setTimeout(poll, 1000);
}

/* ---------- presets ---------- */
function presetContext(config) {
  return {
    set(path, value) {
      const at = locate(path, config);
      if (!at) return;
      if (value && typeof value === "object" && !Array.isArray(value) && isGroup(at.node)) {
        const target = at.obj[at.key] ??= defaultsFor(at.node);
        for (const [name, v] of Object.entries(value)) { const k = keyOf(at.node, name); if (k) target[k] = clone(v); }
      } else at.obj[at.key] = clone(value);
    },
    // Monument group by folder: turns Monuments on and sets the given fields
    group(folder, values) {
      this.set("Monuments.Enabled", true);
      const at = locate("Monuments.monuments", config);
      const item = at?.obj[at.key]?.find(x => x.Folder === folder);
      if (!item) return;
      for (const [name, v] of Object.entries(values)) { const k = keyOf(at.node.items, name); if (k) item[k] = clone(v); }
    },
  };
}

function modal(title, content, buttons) {
  const overlay = h("div", { class: "overlay", onclick: e => { if (e.target === overlay) overlay.remove(); } });
  const close = () => overlay.remove();
  overlay.append(h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": title },
    h("div", { class: "head" }, h("h2", {}, title), h("span", { style: "flex:1" }), h("button", { type: "button", class: "btn ghost small", "aria-label": "Close", onclick: close }, "×")),
    h("div", { class: "content" }, content),
    buttons ? h("div", { class: "foot" }, buttons(close)) : null));
  overlay.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  document.body.append(overlay);
  overlay.querySelector("button")?.focus();
  return close;
}

function openPresets() {
  // Schemas written by older mod versions have no code names to address fields by
  if (!Object.values(S.schema.properties).some(n => n["x-name"])) { toast(t("oldSchema")); return; }
  const list = h("div", {}, PRESETS.map(p => h("div", { class: "preset" },
    h("div", {}, h("b", {}, p.title[S.lang] || p.title.en), h("p", {}, p.desc[S.lang] || p.desc.en)),
    h("button", { type: "button", class: "btn small", onclick: () => { close(); previewPreset(p); } }, t("previewChanges") + " →"))));
  const close = modal(t("presetsTitle"), list);
}

function previewPreset(preset) {
  const next = clone(S.config);
  preset.apply(presetContext(next));
  const changes = diff(S.schema, S.config, next, [], []);
  const content = changes.length
    ? h("table", { class: "diff" }, h("tbody", {}, changes.map(c => h("tr", {}, h("td", { class: "path" }, c.path),
        h("td", {}, h("span", { class: "from" }, show(c.from)), " → ", h("span", { class: "to" }, show(c.to)))))))
    : h("p", { style: "padding:12px 20px; color:var(--muted)" }, t("nothingChanges"));
  modal(preset.title[S.lang] || preset.title.en, content, close => [
    h("button", { type: "button", class: "btn", onclick: () => { close(); openPresets(); } }, t("back")),
    h("button", { type: "button", class: "btn primary", disabled: !changes.length, onclick: () => {
      S.config = next; close(); changed(); drawNav(); drawSection(); toast(t("applied"));
    } }, t("apply"))]);
}

/* ---------- files ---------- */
async function api(method, url, body) {
  const res = await fetch(url, { method, body, headers: { "X-CG": "1", "Content-Type": "application/json" } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function refreshState(keepEdits) {
  const folder = S.config ? valueAt("CustomMonuments.Folder") : null;
  const st = await api("GET", "/api/state" + (folder ? "?custom=" + encodeURIComponent(folder) : ""));
  S.extra = { lastRun: st.lastRun, prefabs: st.prefabs, files: st.files || { custom: [], swap: [] }, generation: st.generation, rustFound: st.rustFound };
  const hadConfig = !!S.config;
  if (st.schema && st.config && !(keepEdits && S.dirty)) {
    S.schema = st.schema; S.config = st.config; S.dirty = false;
    S.lang = st.config[LANG_KEY] === "ru" ? "ru" : "en";
  }
  if (!hadConfig || !keepEdits) render(); else { drawNav(); if (S.section !== TAB_GENERATE) drawSection(); updateTop(); }
}

function load(schema, config, source) {
  S.schema = schema; S.config = config;
  S.lang = config[LANG_KEY] === "ru" ? "ru" : "en";
  document.documentElement.lang = S.lang;
  S.fileName = source || S.fileName;
  S.dirty = false;
  render();
}

async function readJson(file) {
  const text = await file.text();
  try { return JSON.parse(text.replace(/^﻿/, "")); }
  catch (e) { throw new Error(t("badJson", file.name, e.message)); }
}

// Takes any mix of config and schema files (a folder listing or picked files)
async function loadFiles(entries) {
  let config = null, schema = null, handle = null, name = "";
  for (const { file, fileHandle } of entries) {
    if (!/\.json$/i.test(file.name)) continue;
    const json = await readJson(file);
    if (/\.schema\.json$/i.test(file.name) || (json.$schema && String(json.$schema).includes("json-schema.org"))) schema = json;
    else if (/\.(lastrun|prefabs)\.json$/i.test(file.name)) S.extra[/lastrun/i.test(file.name) ? "lastRun" : "prefabs"] = json;
    else if (!config || /^CustomGenerator\.json$/i.test(file.name)) { config = json; handle = fileHandle || null; name = file.name; }
  }
  schema = schema || S.schema;
  if (!config) throw new Error(t("needConfig"));
  if (!schema) throw new Error(t("needSchema"));
  S.handle = handle;
  load(schema, config, name);
  toast(name);
}

async function openFiles() {
  if (S.dirty && !confirmLeave()) return;
  try {
    if ("showOpenFilePicker" in window) {
      const handles = await window.showOpenFilePicker({ multiple: true, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
      await loadFiles(await Promise.all(handles.map(async fileHandle => ({ file: await fileHandle.getFile(), fileHandle }))));
    } else {
      const input = h("input", { type: "file", accept: ".json", multiple: true });
      input.onchange = () => loadFiles([...input.files].map(file => ({ file }))).catch(e => toast(e.message));
      input.click();
    }
  } catch (e) { if (e.name !== "AbortError") toast(e.message); }
}

async function openFolder() {
  try {
    const dir = await window.showDirectoryPicker({ mode: "readwrite" });
    const entries = [];
    for await (const handle of dir.values()) if (handle.kind === "file" && /\.json$/i.test(handle.name)) entries.push({ file: await handle.getFile(), fileHandle: handle });
    await loadFiles(entries);
  } catch (e) { if (e.name !== "AbortError") showStartError(e.message); }
}

function text() { return JSON.stringify(S.config, null, 2); }

// Invalid numbers would be written as null, which the mod can't read
function canSave() {
  if (countProblems(S.schema, S.config) === 0) return true;
  toast(t("fixFirst"));
  return false;
}

// Returns true when the config was written
async function save() {
  if (!canSave()) return false;
  if (API) {
    if (generating()) { toast(t("saveBlocked")); return false; }
    try { await api("PUT", "/api/config", text()); saved(t("saved")); return true; }
    catch (e) { toast(e.message); return false; }
  }
  try {
    if (!S.handle && "showSaveFilePicker" in window)
      S.handle = await window.showSaveFilePicker({ suggestedName: "CustomGenerator.json", types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
    if (S.handle) {
      if (S.handle.requestPermission && (await S.handle.requestPermission({ mode: "readwrite" })) !== "granted") throw new Error("Permission denied");
      const writable = await S.handle.createWritable();
      await writable.write(text()); await writable.close();
      S.fileName = S.handle.name;
      document.getElementById("subtitle").textContent = t("subtitleFile", S.fileName);
      document.querySelector(".banner")?.remove();
      saved(t("saveHint", S.handle.name));
      return true;
    }
  } catch (e) {
    if (e.name === "AbortError") return false;
    toast(e.message);
  }
  return download();
}

function download() {
  if (!canSave()) return false;
  const url = URL.createObjectURL(new Blob([text()], { type: "application/json" }));
  h("a", { href: url, download: "CustomGenerator.json" }).click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  saved(t("downloaded"));
  return true;
}

function saved(message) {
  S.dirty = false;
  const status = document.getElementById("status");
  if (status) status.dataset.saved = "1";
  updateTop();
  toast(message);
}

function confirmLeave() { return window.confirm(t("leave")); }

/* ---------- start screen (no data inlined, opened as a file) ---------- */
function showStartError(message) { const el = document.getElementById("start-msg"); if (el) el.textContent = message; else toast(message); }
function renderStart() {
  S.lang = (navigator.language || "").startsWith("ru") ? "ru" : "en";
  const input = h("input", { type: "file", accept: ".json", multiple: true, hidden: true,
    onchange: () => loadFiles([...input.files].map(file => ({ file }))).catch(e => showStartError(e.message)) });
  const drop = h("div", { class: "drop" },
    h("p", { html: t("startText") }),
    h("div", { class: "btns" },
      "showDirectoryPicker" in window ? h("button", { type: "button", class: "btn primary", onclick: openFolder }, t("openFolder")) : null,
      h("button", { type: "button", class: "btn", onclick: () => input.click() }, t("pickFiles")), input),
    h("p", { class: "msg", id: "start-msg" }));
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => {
    e.preventDefault(); drop.classList.remove("over");
    loadFiles([...e.dataTransfer.files].map(file => ({ file }))).catch(err => showStartError(err.message));
  });
  document.getElementById("app").replaceChildren(h("div", { class: "start" }, h("div", { class: "logo", style: "margin:0 auto 14px; width:44px; height:44px; font-size:18px" }, "CG"), h("h1", {}, t("startTitle")), drop));
}

/* ---------- boot ---------- */
window.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s" && S.config) { e.preventDefault(); save(); } });
window.addEventListener("beforeunload", e => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  if (!S.config || e.defaultPrevented || API) return;
  e.preventDefault();
  loadFiles([...e.dataTransfer.files].map(file => ({ file }))).catch(err => toast(err.message));
});

(async function boot() {
  if (API) {
    S.lang = (navigator.language || "").startsWith("ru") ? "ru" : "en";
    try { await refreshState(false); } catch (e) { document.getElementById("app").textContent = e.message; return; }
    if (!S.config) S.section = TAB_GENERATE;
    render();
    if (generating()) poll();
    return;
  }
  let data = null;
  try { data = JSON.parse(document.getElementById("cg-data").textContent); } catch { /* standalone page */ }
  if (data && data.schema && data.config) {
    S.embedded = true; S.savedAt = data.savedAt || "";
    S.extra = { ...S.extra, lastRun: data.lastRun || null, prefabs: data.prefabs || null, files: data.files || { custom: [], swap: [] } };
    load(data.schema, data.config, "CustomGenerator.json");
  } else renderStart();
})();
</script>
